[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Database URL — Alembic reads this directly.
# Mirrors the DATABASE_URL built in app/core/config.py.
# Override with an env var: ALEMBIC_DB_URL=postgresql://...
sqlalchemy.url = postgresql://watsonx_user:watsonx_secure_2024@localhost:5432/ai_services_platform

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
